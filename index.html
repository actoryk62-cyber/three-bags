<script>
  (() => {

      document

    // 세 단계 = 스탁사인 가방 3개. good = 받으면 점수, bad = 받으면 목숨 −1 (n: 화면에 뜨는 이유)

      const i = new Image();
      i.onload = () => {

    const bagImg = () => {
      const i = IMGS[si];
      return i && i.complete && i.naturalWidth ? i : null;

    let W = 0,
      H = 0,

    window.__gameState = () => state; // 녹화 도구가 끝난 시점을 알 수 있게
    let si = 0; // 현재 단계
    let items = [],

      keys = {};

      stageStart = 0,
      lives = 3,
      timeLeft = 20,
      spawnT = 0,
      last = 0,
      beltOff = 0,
      flash = 0;
    let best = 0;
    try {
      best = +localStorage.getItem("threeBagsBest") || 0;
    } catch (e) {}

    const css = (n) =>
      getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const st = () => STAGES[si];

    function sizeBag() {
      const im = bagImg();
      bag.w = W * st().bagW;
      bag.h = bag.w * (im ? im.naturalHeight / im.naturalWidth : st().ratio);
      bag.x = Math.max(bag.w / 2, Math.min(W - bag.w / 2, bag.x || W / 2));
    }
    function resize() {
      const r = stageBox.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = r.width;
      H = r.height;
      cv.width = W * dpr;
      cv.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high"; // 큰 사진을 작게 그릴 때 덜 깨져요
      sizeBag();
      draw();
    }

    function spawn() {
      const prog = 1 - timeLeft / st().time; // 0 → 1, 단계가 진행될수록 빨라져요
      const level = 1 + si * 0.3 + prog * 0.5;
      const isBad = Math.random() < BAD_P;
      const pool = isBad ? st().bad : st().good;
      const kind = pool[(Math.random() * pool.length) | 0];
      const size = W * 0.1;
      items.push({
        ...kind,
        bad: isBad,
        x: size / 2 + Math.random() * (W - size),
        y: -size,
        s: size,
        v: H * (0.22 + Math.random() * 0.12) * level,
        r: (Math.random() - 0.5) * 0.6,
      });
    }

    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
    }

    function hud() {
      $("bagName").textContent = st().short;
      $("score").textContent = score;
      $("time").textContent = Math.ceil(timeLeft);
      $("lives").textContent = "❤".repeat(lives) + "♡".repeat(3 - lives);
      [...$("steps").children].forEach((li, i) => {
        li.classList.toggle("on", i === si);
        li.classList.toggle("done", i < si);
      });
    }

    function overlay(html) {
      const o = $("overlay");
      o.innerHTML = html;
      o.hidden = false;
    }

    function showIntro(msg) {
      const s = st();
      overlay(`
      ${msg ? `<p class="clear">${msg}</p>` : ""}
      <img class="intro-img ${s.tall ? "tall" : ""}" src="${s.img}" alt="스탁사인 ${s.name}">
      <p class="eyebrow">${si + 1}단계 · 스탁사인 ${s.name}</p>
      <h2>${s.brief}</h2>
      <div class="rules">
        <div class="ok"><strong>받으면 +점수</strong>${s.good.map((g) => `${g.e} ${g.n}`).join(" · ")}</div>
        <div class="no"><strong>받으면 −목숨</strong>${s.bad.map((b) => `${b.e} ${b.s}`).join(" · ")}</div>
      </div>
      <button id="go" type="button">${si === 0 ? "게임 시작" : "짐 싸기 시작"}</button>`);
      $("go").addEventListener("click", startStage);
      if (DEMO) setTimeout(() => $("go")?.click(), si === 0 ? 1600 : 1900);
    }

    function startStage() {
      items = [];
      lives = 3;
      timeLeft = DEMO ? Math.min(st().time, 6) : st().time;
      spawnT = 0;
      flash = 0;
      stageStart = score;
      bag.x = W / 2;
      sizeBag();
      state = "play";
      $("overlay").hidden = true;
      hud();
      last = performance.now();
      requestAnimationFrame(loop);
    }

    function stageClear() {
      state = "clear";
      const gained = score - stageStart,
        done = st().short;
      if (si < STAGES.length - 1) {
        si++;
        hud();
        showIntro(`${done} 완료! +${gained}점`);
      } else finish();
    }

    function gameOver() {
      state = "over";
      overlay(`
      <h2>보안 검색에서 멈췄어요</h2>
      <p>틀린 짐이 3번 들어갔어요. ${st().short}부터 다시 싸 볼까요?</p>
      <button id="go" type="button">이 가방 다시 싸기</button>`);
      $("go").addEventListener("click", () => {
        score = stageStart;
        startStage();
      });
    }

    // 응모 번호 = SKT-{완주 시각(분, 36진수)}{무작위 2자}-{확인 2자}. 확인 2자는 check()로 다시 계산해 맞는지 볼 수 있어요.
    function check(s) {
      let h = 2166136261;
      for (const ch of s + "|STARKSEIN-TRAVELS-2026") {
        h ^= ch.charCodeAt(0);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return (h % 1296).toString(36).toUpperCase().padStart(2, "0");
    }
    function makeCode() {
      const m = Math.floor(Date.now() / 60000)
        .toString(36)
        .toUpperCase();
      const r = Math.floor(Math.random() * 1296)
        .toString(36)
        .toUpperCase()
        .padStart(2, "0");
      return `SKT-${m}${r}-${check(m + r)}`;
    }

    function finish() {
      state = "done";
      if (score > best) {
        best = score;
        try {
          localStorage.setItem("threeBagsBest", best);
        } catch (e) {}
      }
      const d = new Date(),
        date = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
      overlay(`
      <div class="card" role="group" aria-label="완주 카드">
        <div class="card-eyebrow"><img class="band-logo" src="img/logo_word.png" alt="STARK SEIN"><span>· 세 가방 짐 싸기</span></div>
        <div class="card-title">완주!</div>
        <div class="card-bags">${STAGES.map((s) => `<img class="${s.tall ? "tall" : ""}" src="${s.img}" alt="스탁사인 ${s.name}">`).join("")}</div>
        <div class="card-row"><span>점수</span><b>${score.toLocaleString("ko-KR")}점</b></div>
        <div class="card-row"><span>응모 번호</span><b class="code">${DEMO ? "SKT-○○○○○○○-○○" : makeCode()}</b></div>
        <div class="card-foot">${date} · @starksein_travels</div>
      </div>
      <p>이 화면을 캡처해 스토리에 올리고 @starksein_travels 를 태그해 주세요.</p>
      <button id="go" type="button">다시 하기</button>`);
      $("go").addEventListener("click", () => {
        si = 0;
        score = 0;
        hud();
        sizeBag();
        draw();
        showIntro();
      });
    }

    function loop(now) {
      if (state !== "play") return;
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        hud();
        draw();
        return stageClear();
      }

      const speed = W * 1.3;
      if (DEMO) {
        // 자동 플레이: 가장 먼저 도착할 맞는 짐 쪽으로 가고, 틀린 짐이 가까우면 옆으로 피해요
        const mouthY = bagTop() + bag.h * (bagImg() ? st().mouth : 0);
        let target = null,
          soonest = Infinity;
        for (const it of items) {
          if (it.done || it.y > mouthY) continue;
          const eta = (mouthY - it.y) / it.v;
          if (it.bad) {
            if (eta < 0.9 && Math.abs(it.x - bag.x) < bag.w / 2 + it.s * 0.6)
              target = {
                x: it.x < bag.x ? it.x + bag.w + it.s : it.x - bag.w - it.s,
                dodge: true,
              };
            continue;
          }
          if (!target?.dodge && eta < soonest) {
            soonest = eta;
            target = { x: it.x };
          }
        }
        if (target)
          bag.x += Math.max(
            -speed * dt,
            Math.min(speed * dt, target.x - bag.x),
          );
      }
      if (keys.ArrowLeft) bag.x -= speed * dt;
      if (keys.ArrowRight) bag.x += speed * dt;
      bag.x = Math.max(bag.w / 2, Math.min(W - bag.w / 2, bag.x));

      spawnT -= dt;
      if (spawnT <= 0) {
        spawn();
        spawnT = Math.max(
          0.35,
          0.85 - si * 0.1 - (1 - timeLeft / st().time) * 0.3,
        );
      }

      const mouth = bagTop() + bag.h * (bagImg() ? st().mouth : 0); // 가방 입구 높이
      for (const it of items) {
        it.y += it.v * dt;
        if (
          !it.done &&
          it.y + it.s * 0.35 >= mouth &&
          it.y < mouth + Math.max(bag.h * 0.35, it.s) &&
          Math.abs(it.x - bag.x) < bag.w / 2 + it.s * 0.2
        ) {
          it.done = true;
          if (it.bad) {
            lives--;
            flash = 0.35;
            toast(it.n);
            if (lives <= 0) {
              hud();
              draw();
              return gameOver();
            }
          } else score += it.p;
        }
      }
      items = items.filter((it) => !it.done && it.y < H + it.s);
      beltOff = (beltOff + dt * 40) % 40;
      flash = Math.max(0, flash - dt);
      hud();
      draw();
      requestAnimationFrame(loop);
    }

    const bagTop = () => H - bag.h - H * 0.05;

    // 배경 워터마크: 비스듬히 반복되는 STARK SEIN 워드마크 (아주 옅게)
    // 배경 워터마크: 스탁사인 로고(엠블럼+워드마크)를 비스듬히 반복, 아주 옅게. 색은 테마의 글자색으로 입혀요
    const LOGO = new Image();
    LOGO.onload = draw;
    LOGO.src = "img/logo_full.png";
    const tintCache = {};
    function tintedLogo(color) {
      if (tintCache[color]) return tintCache[color];
      const c = document.createElement("canvas");
      c.width = LOGO.naturalWidth;
      c.height = LOGO.naturalHeight;
      const x = c.getContext("2d");
      x.drawImage(LOGO, 0, 0);
      x.globalCompositeOperation = "source-in";
      x.fillStyle = color;
      x.fillRect(0, 0, c.width, c.height);
      return (tintCache[color] = c);
    }
    function drawWatermark() {
      if (!LOGO.complete || !LOGO.naturalWidth) return;
      const t = tintedLogo(css("--ink"));
      const w = W * 0.36,
        h = (w * t.height) / t.width;
      const stepX = w * 1.4,
        stepY = h * 1.45;
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.translate(W / 2, H / 2);
      ctx.rotate(-Math.PI / 12);
      for (let row = -3; row <= 3; row++)
        for (let col = -2; col <= 2; col++)
          ctx.drawImage(
            t,
            col * stepX + (row % 2 ? stepX / 2 : 0) - w / 2,
            row * stepY - h / 2,
            w,
            h,
          );
      ctx.restore();
    }

    function draw() {
      if (!W) return;
      ctx.fillStyle = css("--belt");
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = css("--belt-stripe");
      for (let y = -40 + beltOff; y < H; y += 40) ctx.fillRect(0, y, W, 14);
      drawWatermark();

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const it of items) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.r * Math.sin(it.y / 60));
        ctx.font = `${it.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.fillText(it.e, 0, 0);
        ctx.restore();
      }
      drawBag();
    }

    function drawBag() {
      const bw = bag.w,
        bh = bag.h,
        bx = bag.x - bw / 2,
        by = bagTop();
      const im = bagImg();
      if (im) {
        // 제품 사진으로 그려요. 틀린 짐을 받으면 빨간 테두리 빛 + 살짝 흔들림
        ctx.save();
        if (flash > 0) {
          ctx.shadowColor = css("--bad");
          ctx.shadowBlur = 26;
          ctx.translate(Math.sin(flash * 60) * 4, 0);
        }
        ctx.drawImage(im, bx, by, bw, bh);
        ctx.restore();
        return;
      }
      const col = flash > 0 ? css("--bad") : css(st().color);
      ctx.strokeStyle = css("--ink");
      ctx.fillStyle = css("--ink");
      ctx.lineWidth = 3;
      if (si === 0) {
        // 크로스백: 긴 끈 + 덮개
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.12, by + 2);
        ctx.quadraticCurveTo(bag.x, by - bh * 1.1, bx + bw * 0.88, by + 2);
        ctx.stroke();
        ctx.fillStyle = col;
        roundRect(bx, by, bw, bh, bh * 0.18);
        ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.16)";
        roundRect(bx, by, bw, bh * 0.42, bh * 0.18);
        ctx.fill();
        ctx.fillStyle = css("--ink");
        ctx.beginPath();
        ctx.arc(bag.x, by + bh * 0.42, 3, 0, 7);
        ctx.fill();
      } else if (si === 1) {
        // 보스턴백: 둥근 몸통 + 손잡이 두 개 + 지퍼
        ctx.beginPath();
        ctx.moveTo(bx + bw * 0.28, by + 2);
        ctx.quadraticCurveTo(
          bx + bw * 0.38,
          by - bh * 0.55,
          bx + bw * 0.48,
          by + 2,
        );
        ctx.moveTo(bx + bw * 0.52, by + 2);
        ctx.quadraticCurveTo(
          bx + bw * 0.62,
          by - bh * 0.55,
          bx + bw * 0.72,
          by + 2,
        );
        ctx.stroke();
        ctx.fillStyle = col;
        roundRect(bx, by, bw, bh, bh * 0.45);
        ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.14)";
        ctx.fillRect(bx + bw * 0.12, by + bh * 0.42, bw * 0.76, 3);
      } else {
        // 캐리어: 손잡이 + 세로 홈 + 바퀴
        ctx.fillRect(bag.x - bw * 0.18, by - bh * 0.28, bw * 0.06, bh * 0.3);
        ctx.fillRect(bag.x + bw * 0.12, by - bh * 0.28, bw * 0.06, bh * 0.3);
        ctx.fillRect(bag.x - bw * 0.18, by - bh * 0.3, bw * 0.36, bh * 0.07);
        ctx.fillStyle = col;
        roundRect(bx, by, bw, bh, bh * 0.18);
        ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,0.12)";
        for (let i = 1; i < 4; i++)
          ctx.fillRect(bx + (bw * i) / 4 - 1, by + bh * 0.12, 2, bh * 0.76);
        ctx.fillStyle = css("--ink");
        ctx.beginPath();
        ctx.arc(bx + bw * 0.15, by + bh + 4, 4, 0, 7);
        ctx.arc(bx + bw * 0.85, by + bh + 4, 4, 0, 7);
        ctx.fill();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // 조작
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        keys[e.key] = true;
        e.preventDefault();
      }
    });
    addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });
    function pointer(e) {
      if (state !== "play") return;
      const r = cv.getBoundingClientRect();
      bag.x = Math.max(bag.w / 2, Math.min(W - bag.w / 2, e.clientX - r.left));
    }
    cv.addEventListener("pointermove", pointer);
    cv.addEventListener("pointerdown", pointer);

    new ResizeObserver(resize).observe(stageBox);
    document.fonts?.ready.then(draw); // 워터마크 글씨체가 늦게 오면 한 번 더 그려요
    matchMedia("(prefers-color-scheme: dark)").addEventListener?.(
      "change",
      draw,
    );
    new MutationObserver(draw).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-theme"],
    });

    // 처음 화면: 1단계 가방과 예시 짐
    resize();
    items = [STAGES[0].good[0], STAGES[0].bad[3], STAGES[0].good[4]].map(
      (k, i) => ({
        ...k,
        x: W * (0.25 + i * 0.25),
        y: H * (0.18 + i * 0.12),
        s: W * 0.1,
        r: 0,
      }),
    );
    draw();
    hud();
    showIntro("가방 3개를 모두 싸면 완주 카드와 응모 번호가 나와요.");
  })();
</script>
</body>
</html>
